<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Citizen ID Services</title>

<style>
*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
    background:#f1f5f9;
    color:#172033;
}

header{
    background:linear-gradient(135deg,#075eaa,#1684d8);
    color:white;
    padding:28px 15px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:32px;
}

header p{
    margin:8px 0 0;
}

nav{
    background:white;
    padding:10px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:5px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 8px #0002;
}

nav a{
    text-decoration:none;
    color:#14598e;
    font-weight:bold;
    padding:9px 11px;
    border-radius:8px;
}

nav a:hover{
    background:#e8f3fb;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:18px;
}

.card{
    background:white;
    border-radius:16px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 5px 18px #00000012;
}

.card h2{
    margin-top:0;
    color:#145b91;
}

.notice{
    background:#fff8dc;
    border-left:5px solid #e0a900;
    padding:15px;
    border-radius:8px;
    line-height:1.7;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.services{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.service{
    background:#f5f9fd;
    padding:14px;
    border-radius:9px;
    border:1px solid #e2e8f0;
}

.btn{
    display:inline-block;
    border:none;
    background:#0878d1;
    color:white;
    text-decoration:none;
    padding:11px 17px;
    border-radius:8px;
    margin:5px 3px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    opacity:.88;
}

.green{
    background:#159447;
}

.red{
    background:#df3847;
}

.orange{
    background:#e68918;
}

label{
    display:block;
    font-weight:bold;
    margin:14px 0 7px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:8px;
    font-size:15px;
}

.preview-area{
    width:100%;
    max-width:400px;
    min-height:220px;
    margin:20px auto;
    border:2px dashed #94a3b8;
    border-radius:10px;
    background:#fafafa;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    text-align:center;
}

.preview-area img{
    display:block;
    max-width:100%;
    max-height:100%;
}

.document-preview{
    width:100%;
    min-height:300px;
    margin-top:18px;
    border:2px dashed #94a3b8;
    border-radius:10px;
    background:#fafafa;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.document-preview img{
    max-width:100%;
    max-height:650px;
}

.document-preview iframe{
    width:100%;
    height:650px;
    border:0;
}

.center{
    text-align:center;
}

.payment-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.payment-card{
    border:1px solid #d8e0e8;
    background:#f8fafc;
    border-radius:12px;
    padding:18px;
}

.price{
    color:#138a43;
    font-size:25px;
    font-weight:bold;
}

.upi{
    background:#effff3;
    border:1px solid #b9dfc2;
    padding:16px;
    border-radius:10px;
    margin-top:15px;
}

.upi-id{
    color:#137333;
    font-size:19px;
    font-weight:bold;
    word-break:break-all;
}

footer{
    background:#172033;
    color:white;
    text-align:center;
    padding:25px 10px;
    line-height:1.7;
}

.small{
    font-size:13px;
}

@media(max-width:700px){

    header h1{
        font-size:27px;
    }

    .container{
        padding:12px;
    }

    .grid,
    .services,
    .payment-grid{
        grid-template-columns:1fr;
    }

    .card{
        padding:17px;
    }

    nav a{
        font-size:13px;
        padding:7px 8px;
    }
}


/* =========================================
   PRINT SYSTEM
========================================= */

@media print{

    @page{
        margin:10mm;
    }

    body{
        background:white;
    }

    body *{
        visibility:hidden;
    }

    #printArea,
    #printArea *{
        visibility:visible;
    }

    #printArea{
        position:absolute;
        left:0;
        top:0;
        margin:0;
        padding:0;
        background:white;
    }

    .no-print{
        display:none !important;
    }
}


/* ID CARD PRINT SIZE */

.print-id-card{
    width:85.6mm;
    height:54mm;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}

.print-id-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}


/* PASSPORT PHOTO PRINT SIZE */

.print-passport{
    width:35mm;
    height:45mm;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}

.print-passport img{
    width:100%;
    height:100%;
    object-fit:cover;
}


/* A4 PRINT */

.print-a4{
    width:210mm;
    min-height:297mm;
    overflow:hidden;
}

.print-a4 img{
    max-width:100%;
    max-height:285mm;
    object-fit:contain;
}

</style>
</head>


<body>


<header id="home">

    <h1>नमस्ते! 👋</h1>

    <p>Citizen ID Services में आपका स्वागत है</p>

</header>
