html{
    scroll-behavior:smooth;

body{

/* HEADER */

header{
    background:linear-gradient(135deg,#075eaa,#1684d8);

    padding:28px 15px;

}

header h1{
    margin:0;

}

header p{
    margin:8px 0 0;
    font-size:16px;
}

/* NAVIGATION */

nav{
    background:white;
    padding:10px;

    flex-wrap:wrap;
    gap:6px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 2px 8px #0002;
}

nav a{
    text-decoration:none;
    color:#14598e;
    font-weight:bold;
    padding:9px 12px;
    border-radius:8px;
}

nav a:hover{
    background:#e8f3fb;
}

/* CONTAINER */

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:18px;
}

/* CARD */

    padding:22px;
    margin-bottom:20px;
    box-shadow:0 5px 18px #00000012;
}

.card h2{
    margin-top:0;
    color:#145b91;
}
