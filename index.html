<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Citizen ID Services</title>

<style>
*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
    background:#eef3f8;
    color:#172033;
}

/* HEADER */
header{
    background:linear-gradient(135deg,#075eaa,#1684d8);
    color:white;
    text-align:center;
    padding:28px 15px;
}

header h1{
    margin:0;
    font-size:30px;
}

header p{
    margin:8px 0 0;
    font-size:16px;
}

/* NAVIGATION */
nav{
    background:white;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:4px;
    padding:10px;
    position:sticky;
    top:0;
    z-index:999;
    box-shadow:0 2px 8px #0002;
}

nav a{
    color:#14598e;
    text-decoration:none;
    font-weight:bold;
    padding:9px 10px;
    border-radius:7px;
}

nav a:hover{
    background:#e7f2fb;
}

/* CONTAINER */
.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:18px;
}

/* CARD */
.card{
    background:white;
    border-radius:16px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 5px 18px #00000012;
}

.card h2{
    color:#145b91;
    margin-top:0;
}

/* NOTICE */
.notice{
    background:#fff7d6;
    border-left:5px solid #e5b300;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.portal-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

/* BUTTON */
.btn,
button{
    display:inline-block;
    border:0;
    background:#0878cf;
    color:white;
    padding:11px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    text-decoration:none;
    margin:4px 3px;
